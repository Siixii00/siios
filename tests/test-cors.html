<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilibili API 測試</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #fb7299;
        }
        button {
            background: #fb7299;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 4px;
        }
        button:hover {
            background: #f25285;
        }
        .result {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
    </style>
</head>
<body>
    <h1 style="color: #fb7299;">Bilibili API CORS 測試</h1>
    <p>測試瀏覽器是否能直接調用 Bilibili API</p>
    
    <div class="test-card">
        <h2>測試 1：無 headers</h2>
        <button onclick="test1()">執行</button>
        <div class="result" id="result1">點擊按鈕開始測試...</div>
    </div>
    
    <div class="test-card">
        <h2>測試 2：帶 Referer header</h2>
        <button onclick="test2()">執行</button>
        <div class="result" id="result2">點擊按鈕開始測試...</div>
    </div>
    
    <div class="test-card">
        <h2>測試 3：通過 Worker 代理</h2>
        <button onclick="test3()">執行</button>
        <div class="result" id="result3">點擊按鈕開始測試...</div>
    </div>
    
    <div class="test-card">
        <h2>測試 4：熱門 API（無需登入）</h2>
        <button onclick="test4()">執行</button>
        <div class="result" id="result4">點擊按鈕開始測試...</div>
    </div>
    
    <script>
        async function test1() {
            const result = document.getElementById('result1');
            result.textContent = '測試中...';
            
            try {
                const response = await fetch('https://api.bilibili.com/x/web-interface/popular?ps=5');
                const data = await response.json();
                
                if (data.code === 0) {
                    result.innerHTML = `<span class="success">✅ 成功！</span>\n獲取到 ${data.data.list.length} 部影片\n\n${JSON.stringify(data.data.list[0], null, 2)}`;
                } else {
                    result.innerHTML = `<span class="error">❌ API 錯誤: ${data.message}</span>`;
                }
            } catch (error) {
                result.innerHTML = `<span class="error">❌ 失敗: ${error.message}</span>`;
            }
        }
        
        async function test2() {
            const result = document.getElementById('result2');
            result.textContent = '測試中...';
            
            try {
                const response = await fetch('https://api.bilibili.com/x/web-interface/popular?ps=5', {
                    headers: {
                        'Referer': 'https://www.bilibili.com/'
                    }
                });
                const data = await response.json();
                
                if (data.code === 0) {
                    result.innerHTML = `<span class="success">✅ 成功！</span>\n獲取到 ${data.data.list.length} 部影片`;
                } else {
                    result.innerHTML = `<span class="error">❌ API 錯誤: ${data.message}</span>`;
                }
            } catch (error) {
                result.innerHTML = `<span class="error">❌ 失敗: ${error.message}</span>`;
            }
        }
        
        async function test3() {
            const result = document.getElementById('result3');
            result.textContent = '測試中...';
            
            try {
                const response = await fetch('https://siios-bilibili-worker.yaninlin.workers.dev/api/bilibili/hot');
                const data = await response.json();
                
                if (data.success) {
                    result.innerHTML = `<span class="success">✅ Worker 成功！</span>\n獲取到 ${data.videos.length} 部影片`;
                } else {
                    result.innerHTML = `<span class="error">❌ Worker 失敗: ${data.error}</span>`;
                }
            } catch (error) {
                result.innerHTML = `<span class="error">❌ 失敗: ${error.message}</span>`;
            }
        }
        
        async function test4() {
            const result = document.getElementById('result4');
            result.textContent = '測試中...';
            
            try {
                // 嘗試不同的 API 端點
                const response = await fetch('https://api.bilibili.com/x/web-interface/ranking/v2?rid=0&type=all');
                const data = await response.json();
                
                if (data.code === 0) {
                    result.innerHTML = `<span class="success">✅ 成功！</span>\n排行榜 API 可用\n獲取到 ${data.data.list.length} 部影片`;
                } else {
                    result.innerHTML = `<span class="error">❌ API 錯誤: ${data.message}</span>`;
                }
            } catch (error) {
                result.innerHTML = `<span class="error">❌ 失敗: ${error.message}</span>`;
            }
        }
        
        // 自動運行所有測試
        setTimeout(() => {
            console.log('自動運行所有測試...');
            test1();
            setTimeout(() => test2(), 500);
            setTimeout(() => test3(), 1000);
            setTimeout(() => test4(), 1500);
        }, 1000);
    </script>
</body>
</html>
