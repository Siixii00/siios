<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#519D9E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SXIOS">
    <title>SXIOS</title>
    
    <link rel="manifest" href="/siios/manifest.json">
    <link rel="icon" type="image/x-icon" href="/siios/assets/icons/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/siios/assets/icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/siios/assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/siios/assets/icons/icon-512.png">
    <link rel="apple-touch-icon" href="/siios/assets/icons/icon-192.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <link rel="stylesheet" href="/siios/css/shared.css?v=202608071434">
    <link rel="stylesheet" href="/siios/css/ios.css?v=202608071434">
    <link rel="stylesheet" href="/siios/css/kakao.css?v=202608071434">
    <link rel="stylesheet" href="/siios/css/notion-tokens.css?v=202608071434">
    <link rel="stylesheet" href="/siios/css/claude-tokens.css?v=202608071434">
    
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "ios-blue": "#141413",
                        "ios-bg": "#FAF9F6",
                        "ios-surface": "#FFFFFF",
                        "ios-text": "#111827",
                        "ios-muted": "#6B6B6B",
                        "ios-accent": "#16A34A",
                        "ios-border": "rgba(20,20,19,0.12)",
                        "kakao-yellow": "#FEE500",
                        "kakao-brown": "#AC7F5E",
                        "kakao-blue": "#B3C7D5",
                        "kakao-bg": "#FAF9F6",
                        "riso-primary": "#141413",
                        "riso-secondary": "#FAF9F6",
                        "riso-success": "#16A34A",
                        "riso-warning": "#D97706",
                        "riso-danger": "#DC2626",
                        "riso-surface": "#FFFFFF",
                        "riso-text": "#111827",
                        "riso-bg": "#FAF9F6",
                        "claude-primary": "#141413",
                        "claude-secondary": "#FAF9F6",
                        "claude-surface": "#FFFFFF",
                        "claude-text": "#111827",
                        "claude-muted": "#6B6B6B",
                        "claude-border": "rgba(20,20,19,0.12)",
                    },
                    fontFamily: {
                        "ios-display": ["Inter", "sans-serif"],
                        "ios-text": ["Inter", "sans-serif"],
                        "kakao": ["Inter", "sans-serif"],
                        "riso": ["Inter", "sans-serif"],
                        "riso-mono": ["JetBrains Mono", "monospace"],
                        "claude": ["Inter", "sans-serif"],
                        "claude-mono": ["JetBrains Mono", "monospace"],
                    },
                    borderRadius: {
                        "ios-group": "0px",
                        "ios-bubble": "0px",
                        "riso-sm": "4px",
                        "riso-md": "8px",
                        "claude-sm": "4px",
                        "claude-md": "8px",
                        "claude-none": "0px",
                        "claude-cta-bottom": "0 0 8px 8px",
                    },
                    spacing: {
                        "safe-top": "env(safe-area-inset-top)",
                        "safe-bottom": "env(safe-area-inset-bottom)",
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-ios-bg text-ios-text overflow-hidden" style="background:#FAF9F6;color:#111827;">
    <div id="app"></div>
    <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2"></div>
    
    <script type="module" src="/siios/js/app.js?v=202608071434"></script>
    <script src="/siios/js/debug-logger.js?v=202608071434"></script>
    <script src="/siios/js/scroll-handler.js?v=202608071434"></script>
    <script>
        // Force update Service Worker before app loads
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(registration => {
                if (registration && registration.waiting) {
                    console.log('[Index] New Service Worker detected, forcing update');
                    registration.waiting.postMessage({ type: 'FORCE_UPDATE' });
                }
            }).catch(err => console.warn('[Index] SW check failed:', err));
        }
    </script>
</body>
</html>
