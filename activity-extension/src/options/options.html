<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siios Activity Sync - 設定</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FAF9F6;
      color: #111827;
      padding: 40px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 18px;
      font-weight: 600;
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .description {
      color: #6B7280;
      margin-bottom: 24px;
    }

    .section {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="url"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      font-size: 14px;
    }

    input[type="text"]:focus,
    input[type="url"]:focus,
    select:focus {
      outline: none;
      border-color: #10B981;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #F3F4F6;
    }

    .toggle-row:last-child {
      border-bottom: none;
    }

    .toggle-info {
      flex: 1;
    }

    .toggle-info h3 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .toggle-info p {
      font-size: 12px;
      color: #6B7280;
    }

    .toggle {
      width: 44px;
      height: 24px;
      background: #D1D5DB;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .toggle.active {
      background: #10B981;
    }

    .toggle::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.3s;
    }

    .toggle.active::after {
      transform: translateX(20px);
    }

    .button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .button-primary {
      background: #10B981;
      color: white;
    }

    .button-secondary {
      background: #F3F4F6;
      color: #111827;
    }

    .button:hover {
      opacity: 0.9;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .help-text {
      font-size: 12px;
      color: #6B7280;
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      margin-left: 8px;
    }

    .badge-required {
      background: #FEE2E2;
      color: #991B1B;
    }

    .badge-optional {
      background: #DBEAFE;
      color: #1E40AF;
    }
  </style>
</head>
<body>
  <h1>活動同步設定</h1>
  <p class="description">設定 Siios 活動同步的詳細選項</p>

  <div class="section">
    <div class="section-title">基本設定</div>

    <div class="form-group">
      <label>
        PWA URL <span class="badge badge-required">必填</span>
      </label>
      <input type="url" id="pwa-url" placeholder="https://your-siios-app.com">
      <p class="help-text">您部署的 Siios PWA 網址</p>
    </div>

    <div class="form-group">
      <label>同步間隔</label>
      <select id="sync-interval">
        <option value="60000">每 1 分鐘</option>
        <option value="300000" selected>每 5 分鐘</option>
        <option value="900000">每 15 分鐘</option>
        <option value="1800000">每 30 分鐘</option>
        <option value="3600000">每 1 小時</option>
      </select>
    </div>

    <div class="form-group">
      <label>隱私等級</label>
      <select id="privacy-level">
        <option value="basic">基本統計 - 僅記錄平台、活動類型、時間</option>
        <option value="summary">包含摘要 - 記錄活動對象、標題</option>
        <option value="detailed">詳細資訊 - 包含通知內容摘要</option>
      </select>
      <p class="help-text">較高等級會收集更多資訊，請謹慎選擇</p>
    </div>

    <div class="form-group">
      <label>資料保留期限</label>
      <select id="retention-days">
        <option value="7">7 天</option>
        <option value="14">14 天</option>
        <option value="30" selected>30 天</option>
        <option value="60">60 天</option>
        <option value="90">90 天</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">平台設定</div>
    <p class="help-text" style="margin-bottom: 12px;">選擇要記錄哪些平台的活動</p>

    <div id="platforms-container">
      <!-- Will be populated by JavaScript -->
    </div>
  </div>

  <div class="button-group">
    <button id="save-btn" class="button button-primary">保存設定</button>
    <button id="cancel-btn" class="button button-secondary">取消</button>
  </div>

  <script src="src/options/options.js"></script>
</body>
</html>
