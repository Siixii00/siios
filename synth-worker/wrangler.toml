name = "siios-synth-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Workers AI（免費額度：每天 10,000 neurons，用完會直接失敗不扣費）
[ai]
binding = "AI"

# 部署前請設定密鑰：
