<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Album — Figma Export</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .album-app {
            --zapier-canvas: #fffefb;
            --zapier-canvas-soft: #f8f4f0;
            --zapier-ink: #201515;
            --zapier-ink-soft: #2f2a26;
            --zapier-body: #605d52;
            --zapier-body-mid: #939084;
            --zapier-mute: #c5c0b1;
            --zapier-primary: #ff4f00;
            --zapier-on-primary: #fffefb;

            width: 430px;
            height: 932px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--zapier-canvas);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--zapier-ink);
            border: 1px solid #ccc;
        }

        .album-app .ios-header {
            padding: 46px 16px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: auto;
            flex-shrink: 0;
            background: var(--zapier-canvas);
            border-bottom: 1px solid var(--zapier-mute);
            position: relative;
        }

        .album-app .ios-back-btn {
            background: transparent !important;
            color: var(--zapier-ink) !important;
            border: none !important;
            font-size: 16px !important;
            font-weight: 400 !important;
            font-family: 'Inter', system-ui, sans-serif !important;
            display: flex !important;
            align-items: center !important;
            gap: 4px;
            cursor: pointer;
            padding: 8px 0;
            flex-shrink: 0;
            z-index: 2;
        }

        .album-app .menu-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 17px;
            font-weight: 600;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--zapier-ink) !important;
            letter-spacing: -0.4px;
            white-space: nowrap;
            z-index: 1;
        }

        .album-app .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            z-index: 2;
        }

        .album-app .header-action {
            background: var(--zapier-primary);
            border: none;
            color: var(--zapier-on-primary);
            font-size: 16px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }

        .album-app .tab-bar {
            display: flex;
            gap: 0;
            padding: 0 16px;
            border-bottom: 1px solid var(--zapier-mute);
            flex-shrink: 0;
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--zapier-canvas);
        }

        .album-app .tab-btn {
            flex: 1;
            padding: 12px 4px;
            border: none;
            background: transparent;
            color: var(--zapier-body-mid);
            font-size: 16px;
            font-weight: 400;
            font-family: 'Inter', system-ui, sans-serif;
            cursor: pointer;
            position: relative;
            white-space: nowrap;
        }

        .album-app .tab-btn.active {
            color: var(--zapier-ink);
            font-weight: 600;
        }

        .album-app .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            right: 20%;
            width: 60%;
            height: 2px;
            background: var(--zapier-primary);
            border-radius: 1px;
        }

        .album-app .gallery-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: var(--zapier-canvas-soft);
        }

        .album-app .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .album-app .gallery-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
            background: var(--zapier-canvas-soft);
            border-radius: 12px;
        }

        .album-app .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .album-app .source-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            padding: 2px 8px;
            background: var(--zapier-ink);
            color: var(--zapier-on-primary);
            font-size: 11px;
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
            border-radius: 9999px;
        }

        .album-app .source-badge i {
            font-size: 9px;
        }

        .album-app .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            text-align: center;
            color: var(--zapier-body-mid);
            background: var(--zapier-canvas-soft);
        }

        .album-app .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--zapier-mute);
        }

        .album-app .empty-state p {
            font-size: 17px;
            margin-bottom: 4px;
            color: var(--zapier-body-mid);
        }

        .album-app .empty-hint {
            font-size: 13px;
            color: var(--zapier-mute);
            max-width: 260px;
        }

        .album-app .image-viewer {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .album-app .viewer-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(32, 21, 21, 0.92);
        }

        .album-app .image-viewer img {
            position: relative;
            z-index: 1;
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 12px;
        }

        .album-app .viewer-actions {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            z-index: 2;
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .album-app .viewer-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Inter', system-ui, sans-serif;
            backdrop-filter: blur(10px);
        }

        .album-app .viewer-btn i { font-size: 18px; }
        .album-app .viewer-btn-danger { color: var(--zapier-primary); }
    </style>
</head>
<body style="background:#eee; display:flex; justify-content:center; align-items:center; min-height:100vh;">
    <div class="album-app">
        <header class="ios-header">
            <button class="ios-back-btn">
                <i class="fas fa-chevron-left"></i> 返回
            </button>
            <h1 class="menu-title">相簿</h1>
            <div class="header-actions">
                <button class="header-action" title="新增照片">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </header>

        <div class="tab-bar">
            <button class="tab-btn active">全部</button>
            <button class="tab-btn">上傳</button>
            <button class="tab-btn">聊天</button>
            <button class="tab-btn">照相館</button>
        </div>

        <div class="gallery-wrapper">
            <div class="gallery-grid">
                <div class="gallery-item" style="background: linear-gradient(135deg, #f6d5c5, #f0b8a0);">
                    <span class="source-badge"><i class="fas fa-upload"></i> 上傳</span>
                </div>
                <div class="gallery-item" style="background: linear-gradient(135deg, #c5d5f6, #a0c0f0);">
                    <span class="source-badge"><i class="fas fa-chat"></i> 聊天</span>
                </div>
                <div class="gallery-item" style="background: linear-gradient(135deg, #d5f6c5, #b8f0a0);">
                    <span class="source-badge"><i class="fas fa-palette"></i> 照相館</span>
                </div>
                <div class="gallery-item" style="background: linear-gradient(135deg, #f6e5c5, #f0d8a0);"></div>
                <div class="gallery-item" style="background: linear-gradient(135deg, #e5c5f6, #d8a0f0);"></div>
                <div class="gallery-item" style="background: linear-gradient(135deg, #c5f6f0, #a0f0e0);"></div>
                <div class="gallery-item" style="background: linear-gradient(135deg, #f6c5d5, #f0a0b8);"></div>
                <div class="gallery-item" style="background: linear-gradient(135deg, #c5e5f6, #a0d8f0);"></div>
                <div class="gallery-item" style="background: linear-gradient(135deg, #f6f0c5, #f0e0a0);"></div>
            </div>
        </div>
    </div>
</body>
</html>
