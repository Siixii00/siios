# Discord 機器人 Worker 的部署設定。每位使用者都部署在「自己的」Cloudflare 帳號，資料庫也是自己的。
#
# 部署步驟（也可以不用 wrangler：PWA「設定 → Discord 整合 → Worker 部署教學」有全程網頁操作的版本）：
#   1. npx wrangler d1 create siios-discord-db          ← 把輸出的 database_id 貼到下面
#   2. npx wrangler secret put DISCORD_BOT_TOKEN
#   3. npx wrangler secret put DISCORD_APPLICATION_ID
#   4. 在 Cloudflare 後台 Worker → Settings → Variables 新增文字變數 DISCORD_PUBLIC_KEY
#   5. npx wrangler deploy --keep-vars
#   6. 開啟 https://<你的worker網址>/setup 註冊斜線指令
name = "siios-discord-bot"
main = "../scripts/discord-bot-worker.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "siios-discord-db"
database_id = "<貼上 wrangler d1 create 輸出的 database_id>"

# 每 2 分鐘：保持運作並檢查新訊息（沒有這個機器人不會回覆）
[triggers]
crons = ["*/2 * * * *"]
